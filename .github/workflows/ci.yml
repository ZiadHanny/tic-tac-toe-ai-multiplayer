name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check every workspace
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (game-core)
        run: npm run test

      - name: Build the client
        run: npm run build
